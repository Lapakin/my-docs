addr: ":8080"

db:
  host: file-storage-postgres
  port: 5432
  database: file_storage
  user: postgres
  password: postgres
  ssl_mode: disable
  isolation_level: ReadCommitted

minio:
  endpoint: file-storage-minio:9000
  access_key: minioadmin
  secret_key: minioadmin
  use_ssl: false
  bucket_name: documents

jwt:
  secret_key: "your-secret-key-change-in-production-min-32-chars"
  access_token_ttl: 1h
  refresh_token_ttl: 168h

logging:
  level: debug
  formatter: json

