<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }} - MyDocs</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>MyDocs</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <span>📊</span> Dashboard
                </a>
                <a href="/documents" class="nav-item">
                    <span>📄</span> Documents
                </a>
                <a href="/folders" class="nav-item">
                    <span>📁</span> Folders
                </a>
                <a href="/shares" class="nav-item">
                    <span>🔗</span> Shares
                </a>
                <a href="/profile" class="nav-item active">
                    <span>👤</span> Profile
                </a>
                <a href="#" class="nav-item logout" onclick="logout(); return false;">
                    <span>🚪</span> Logout
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>Profile</h1>
            </header>

            <div class="content-body">
                <div class="profile-section">
                    <h2>Account Information</h2>
                    <div id="profileInfo">
                        <p>Loading...</p>
                    </div>
                </div>

                <div class="profile-section">
                    <h2>Change Password</h2>
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label for="currentPassword">Current Password</label>
                            <input type="password" id="currentPassword" name="old_password" required>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" name="new_password" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirm_password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Change Password</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/profile.js"></script>
</body>
</html>
